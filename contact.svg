<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="898" height="228" rx="18" fill="#16141A" stroke="#3B3441" stroke-width="1.5"/>
  <g stroke="#D9BE94" stroke-width="0.8" opacity="0.2" fill="none">
    <path d="M560 40 L640 25 L720 55 L800 30 L860 60 M640 25 L660 90 L720 55 M660 90 L760 110 L800 30"/>
  </g>
  <g fill="#D9BE94">
    <circle cx="560" cy="40" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="25" r="3"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="55" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="30" r="3"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="90" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="110" r="3"><animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="60" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>
  <text x="60" y="68" fill="#BFAE98" font-size="13" letter-spacing="3">LET'S CONNECT</text>
  <text x="58" y="118" fill="#F1E3CC" font-size="36" font-family="Georgia, 'Times New Roman', serif">Let's build something <tspan fill="#D9BE94" font-style="italic">together.</tspan></text>
  <text x="60" y="156" fill="#BFAE98" font-size="16">Open to collaboration in AI research, computer vision &amp; app development.</text>
  <text x="60" y="190" fill="#8C7F70" font-size="13" font-family="Consolas, 'Courier New', monospace">› always learning, always building<tspan fill="#D9BE94"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/> ▌</tspan></text>
</svg>
