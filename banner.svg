<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="c1"><rect x="60" y="250" height="30" width="0"><animate attributeName="width" values="0;330;330;0;0" keyTimes="0;0.10;0.28;0.32;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="60" y="250" height="30" width="0"><animate attributeName="width" values="0;0;220;220;0;0" keyTimes="0;0.33;0.42;0.60;0.64;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="60" y="250" height="30" width="0"><animate attributeName="width" values="0;0;360;360;0" keyTimes="0;0.66;0.76;0.95;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect x="1" y="1" width="898" height="378" rx="18" fill="#16141A" stroke="#3B3441" stroke-width="1.5"/>

  <!-- neural network -->
  <g stroke="#D9BE94" stroke-width="0.8" opacity="0.22" fill="none">
    <path d="M50 70 L150 45 L250 80 M50 70 L150 120 L250 80 M150 45 L150 120 M250 80 L350 55 M250 80 L350 130 M150 120 L250 165 L350 130 M350 55 L430 95 M350 130 L430 95"/>
    <path d="M50 330 L160 350 L270 318 M270 318 L380 345 M160 350 L270 318"/>
  </g>
  <g fill="#D9BE94">
    <circle cx="50" cy="70" r="3.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="45" r="3.5"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="120" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="80" r="4.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="165" r="3.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="55" r="3.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="130" r="3.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="95" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="350" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="318" r="3.5"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="345" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>
  <!-- signal travelling through the network -->
  <circle r="3" fill="#F1E3CC">
    <animateMotion dur="4s" repeatCount="indefinite" path="M50 70 L150 120 L250 80 L350 130 L430 95"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- text -->
  <text x="60" y="198" fill="#BFAE98" font-size="17" letter-spacing="1">Hi there, I'm</text>
  <text x="58" y="244" fill="#F1E3CC" font-size="46" font-family="Georgia, 'Times New Roman', serif">Desi Susanti</text>
  <rect x="60" y="256" width="0" height="0"/>
  <g font-size="18" fill="#D9BE94" font-family="Consolas, 'Courier New', monospace">
    <text x="60" y="274" clip-path="url(#c1)">› Deep learning &amp; computer vision</text>
    <text x="60" y="274" clip-path="url(#c2)">› ANN &amp; SVR research</text>
    <text x="60" y="274" clip-path="url(#c3)">› Android · Flutter · Java · Laravel</text>
  </g>
  <rect x="60" y="258" width="10" height="20" fill="#D9BE94">
    <animate attributeName="x" values="60;390;390;60;60;280;280;60;60;420;420;60" keyTimes="0;0.10;0.28;0.32;0.33;0.42;0.60;0.64;0.66;0.76;0.95;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- character scene (scaled from 680-wide design) -->
  <g transform="translate(-20 10) scale(1.12)">
    <circle cx="660" cy="160" r="135" fill="#3B3441"/>
    <circle cx="660" cy="160" r="135" fill="none" stroke="#D9BE94" stroke-width="0.8" opacity="0.5" stroke-dasharray="3 7">
      <animateTransform attributeName="transform" type="rotate" from="0 660 160" to="360 660 160" dur="40s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(120 0)">
      <!-- blazer -->
      <path d="M446 270 C450 250 470 228 510 222 L570 222 C610 228 630 250 634 270 Z" fill="#141416" stroke="#6A6070" stroke-width="1"/>
      <path d="M512 222 L526 262 M568 222 L554 262" stroke="#4A4452" stroke-width="1.4" fill="none"/>
      <!-- hijab -->
      <path d="M490 150 C486 82 594 82 590 150 L596 208 C600 236 588 252 572 270 L520 270 C530 260 540 250 528 242 L498 236 C488 222 488 190 490 150 Z" fill="#CDBBAE"/>
      <path d="M528 242 C540 250 534 262 522 270 L560 270 C572 258 578 250 574 240 Z" fill="#BCA898"/>
      <path d="M580 160 C586 190 586 214 578 236" stroke="#B9A595" stroke-width="1.2" fill="none"/>
      <path d="M500 150 C498 104 582 104 580 150 C580 186 562 206 540 206 C518 206 500 186 500 150 Z" fill="#B49F8C"/>
      <!-- face -->
      <path d="M506 152 C506 116 574 116 574 152 C574 184 558 200 540 200 C522 200 506 184 506 152 Z" fill="#E3B590"/>
      <path d="M506 132 C514 114 566 114 574 132 C560 122 520 122 506 132 Z" fill="#A9927C"/>
      <path d="M516 136 Q524 132 532 136 M548 136 Q556 132 564 136" stroke="#5A4034" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="524" cy="148" rx="2.6" ry="2.8" fill="#2B211C"><animate attributeName="ry" values="2.8;2.8;0.3;2.8" keyTimes="0;0.92;0.96;1" dur="4s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="556" cy="148" rx="2.6" ry="2.8" fill="#2B211C"><animate attributeName="ry" values="2.8;2.8;0.3;2.8" keyTimes="0;0.92;0.96;1" dur="4s" repeatCount="indefinite"/></ellipse>
      <path d="M511 141 C511 137 537 137 537 141 L536 154 C535 160 513 160 512 154 Z M543 141 C543 137 569 137 569 141 L568 154 C567 160 545 160 544 154 Z" fill="#F4C9C0" fill-opacity="0.25" stroke="#C9A46A" stroke-width="1.6"/>
      <path d="M537 144 Q540 141 543 144" stroke="#C9A46A" stroke-width="1.4" fill="none"/>
      <path d="M538 158 Q540 166 542 168" stroke="#C99877" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <path d="M530 177 Q540 186 550 177" stroke="#A9645A" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="516" cy="168" r="5" fill="#E99A8A" opacity="0.3"/><circle cx="564" cy="168" r="5" fill="#E99A8A" opacity="0.3"/>
      <!-- waving arm -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-8 604 236;14 604 236;-8 604 236" dur="1.1s" repeatCount="indefinite"/>
        <path d="M596 232 C606 214 618 196 626 176 L640 182 C634 204 622 226 612 244 Z" fill="#141416" stroke="#6A6070" stroke-width="1"/>
        <path d="M624 176 L642 182" stroke="#E8E2DA" stroke-width="4" stroke-linecap="round"/>
        <ellipse cx="634" cy="166" rx="10" ry="12" fill="#E3B590"/>
        <path d="M627 158 L625 146 M632 156 L631 142 M637 156 L638 143 M641 159 L644 148" stroke="#E3B590" stroke-width="4" stroke-linecap="round"/>
      </g>
      <!-- speech bubble -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="4s" repeatCount="indefinite"/>
        <rect x="420" y="80" width="62" height="32" rx="9" fill="#F1E3CC"/>
        <path d="M468 112 L480 124 L476 112 Z" fill="#F1E3CC"/>
        <text x="451" y="102" text-anchor="middle" fill="#3A2E26" font-size="16" font-weight="bold">Hai!</text>
      </g>
      <!-- desk -->
      <rect x="420" y="268" width="250" height="12" rx="3" fill="#8B6F57"/>
      <rect x="430" y="280" width="230" height="5" fill="#6E5644"/>
      <!-- laptop -->
      <path d="M486 268 L492 206 C492 202 495 200 499 200 L581 200 C585 200 588 202 588 206 L594 268 Z" fill="#C9CCD2" stroke="#9EA2AA" stroke-width="0.8"/>
      <circle cx="540" cy="234" r="5" fill="none" stroke="#9EA2AA" stroke-width="0.8"/>
      <rect x="476" y="264" width="128" height="5" rx="2" fill="#B4B7BE"/>
      <!-- mug -->
      <rect x="612" y="246" width="20" height="22" rx="3" fill="#E8E2DA"/>
      <path d="M632 252 C640 252 640 262 632 262" stroke="#E8E2DA" stroke-width="2.5" fill="none"/>
      <path d="M618 240 C616 234 622 232 620 226 M626 240 C624 234 630 232 628 226" stroke="#BFAE98" stroke-width="1" fill="none"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="2.5s" repeatCount="indefinite"/></path>
      <!-- plant -->
      <rect x="444" y="250" width="18" height="18" rx="2" fill="#7A5C48"/>
      <path d="M453 250 C446 238 444 230 448 224 M453 250 C454 236 458 228 462 224 M453 250 C452 240 452 232 454 220" stroke="#7FA37A" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
