      <path d="M371 232 L346 238 L336 322 L346 324 L354 252 Z" fill="#141416" stroke="#6A6070" stroke-width="0.8"/>
      <circle cx="341" cy="328" r="6" fill="#E3B590"/>
      <circle cx="409" cy="328" r="6" fill="#E3B590"/>
      <rect x="356" y="326" width="38" height="58" fill="#1C1C20"/>
      <line x1="375" y1="330" x2="375" y2="384" stroke="#33333A" stroke-width="1.2"/>
      <path d="M350 234 C356 229 366 227 375 227 C384 227 394 229 400 234 L404 332 L346 332 Z" fill="#141416" stroke="#6A6070" stroke-width="1"/>
      <path d="M362 238 L370 300 M388 238 L380 300" stroke="#4A4452" stroke-width="1" fill="none"/>
      <ellipse cx="364" cy="388" rx="11" ry="5" fill="#0D0D0F"/>
      <ellipse cx="386" cy="388" rx="11" ry="5" fill="#0D0D0F"/>
      <!-- hijab drape -->
      <path d="M356 236 C366 244 384 244 396 236 L392 262 C388 280 378 296 368 304 C370 286 366 270 352 258 Z" fill="#CDBBAE"/>
      <path d="M392 262 C388 280 378 296 368 304 C374 288 380 274 384 258 Z" fill="#BCA898"/>
    </g>
    <!-- head (reused design scaled 0.5) -->
    <g transform="translate(70 118) scale(0.5)">
      <path d="M490 150 C486 82 594 82 590 150 L596 208 C600 236 588 252 572 250 L520 250 L498 236 C488 222 488 190 490 150 Z" fill="#CDBBAE"/>
      <path d="M500 150 C498 104 582 104 580 150 C580 186 562 206 540 206 C518 206 500 186 500 150 Z" fill="#B49F8C"/>
      <path d="M506 152 C506 116 574 116 574 152 C574 184 558 200 540 200 C522 200 506 184 506 152 Z" fill="#E3B590"/>
      <path d="M506 132 C514 114 566 114 574 132 C560 122 520 122 506 132 Z" fill="#A9927C"/>
      <path d="M516 136 Q524 132 532 136 M548 136 Q556 132 564 136" stroke="#5A4034" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="524" cy="148" rx="3" ry="3.2" fill="#2B211C"><animate attributeName="ry" values="3.2;3.2;0.4;3.2" keyTimes="0;0.92;0.96;1" dur="5s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="556" cy="148" rx="3" ry="3.2" fill="#2B211C"><animate attributeName="ry" values="3.2;3.2;0.4;3.2" keyTimes="0;0.92;0.96;1" dur="5s" repeatCount="indefinite"/></ellipse>
      <path d="M511 141 C511 137 537 137 537 141 L536 154 C535 160 513 160 512 154 Z M543 141 C543 137 569 137 569 141 L568 154 C567 160 545 160 544 154 Z" fill="#F4C9C0" fill-opacity="0.25" stroke="#C9A46A" stroke-width="2.2"/>
      <path d="M537 144 Q540 141 543 144" stroke="#C9A46A" stroke-width="2" fill="none"/>
      <path d="M530 177 Q540 186 550 177" stroke="#A9645A" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <circle cx="516" cy="168" r="6" fill="#E99A8A" opacity="0.3"/><circle cx="564" cy="168" r="6" fill="#E99A8A" opacity="0.3"/>
    </g>

    <!-- details -->
    <text x="430" y="186" fill="#221E26" font-size="26" font-family="Georgia, 'Times New Roman', serif">Desi Susanti</text>
    <text x="430" y="208" fill="#8C6B4F" font-size="11" letter-spacing="0.6">AI · COMPUTER VISION · MOBILE</text>
    <line x1="430" y1="222" x2="628" y2="222" stroke="#D8C8B0"/>
    <g font-size="11" letter-spacing="1.5" fill="#A08A70">
      <text x="430" y="246">FOCUS</text>
      <text x="430" y="290">RESEARCH</text>
      <text x="430" y="334">STACK</text>
    </g>
    <g font-size="14" fill="#2E2830">
      <text x="430" y="264">Deep learning &amp; computer vision</text>
      <text x="430" y="308">ANN · SVR</text>
      <text x="430" y="352">Python · Flutter · Java · Laravel</text>
    </g>
    <!-- barcode -->
    <g fill="#2E2830">
      <rect x="430" y="370" width="2" height="24"/><rect x="435" y="370" width="4" height="24"/><rect x="442" y="370" width="1" height="24"/><rect x="446" y="370" width="3" height="24"/><rect x="452" y="370" width="2" height="24"/><rect x="457" y="370" width="5" height="24"/><rect x="465" y="370" width="1" height="24"/><rect x="469" y="370" width="3" height="24"/><rect x="475" y="370" width="2" height="24"/><rect x="480" y="370" width="4" height="24"/><rect x="487" y="370" width="1" height="24"/><rect x="491" y="370" width="3" height="24"/><rect x="497" y="370" width="2" height="24"/><rect x="502" y="370" width="5" height="24"/>
    </g>
    <text x="430" y="420" fill="#8C6B4F" font-size="11" font-family="Consolas, 'Courier New', monospace">github.com/des1susanti</text>
    <!-- shine sweep -->
    <rect x="250" y="88" width="30" height="350" fill="#FFFFFF" opacity="0">
      <animate attributeName="x" values="250;620;620" keyTimes="0;0.25;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.18;0;0" keyTimes="0;0.12;0.25;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
