<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="898" height="468" rx="18" fill="#16141A" stroke="#3B3441" stroke-width="1.5"/>
  <text x="40" y="52" fill="#BFAE98" font-size="13" letter-spacing="3">PROFILE AT A GLANCE</text>

  <g>
    <animateTransform attributeName="transform" type="rotate" values="-2.5 450 0;2.5 450 0;-2.5 450 0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <!-- lanyard -->
    <path d="M405 0 L440 74 M495 0 L460 74" stroke="#8C6B4F" stroke-width="10" stroke-linecap="round"/>
    <path d="M405 0 L440 74 M495 0 L460 74" stroke="#D9BE94" stroke-width="2" stroke-dasharray="4 6"/>
    <rect x="432" y="70" width="36" height="22" rx="4" fill="#C9CCD2" stroke="#9EA2AA"/>
    <!-- card -->
    <rect x="250" y="88" width="400" height="350" rx="16" fill="#F4EBDD"/>
    <path d="M250 104 C250 95 257 88 266 88 L634 88 C643 88 650 95 650 104 L650 140 L250 140 Z" fill="#221E26"/>
    <rect x="430" y="98" width="40" height="8" rx="4" fill="#16141A"/>
